# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
#
# Schema version 1.
manifest_version: 1

name: careerweaver
description: >-
  Tailor resumes from a verified fact graph and fill job applications
  (Greenhouse/Lever/Workable/Ashby), stopping before submit for human review.
source: https://github.com/idea-torx/CareerWeaver

# CareerWeaver runs entirely on the user's machine: weaver.db holds their career
# facts and the fill step drives their own Chrome with their own logged-in ATS
# sessions. Nothing is hosted, so there is no url — Hermes spawns the server.
#
# The command is an absolute path into the clone, not a bare launcher. Hermes
# prepends only its managed *Node* directories to the spawn PATH
# (with_hermes_node_path); there is no uv equivalent, and nothing checks that
# transport.command resolves at install time. A manifest naming `uvx` or
# `weaver-mcp` therefore installs clean and then fails at connect with ENOENT
# on any machine where that binary is not already on the inherited PATH.
transport:
  type: stdio
  command: "${INSTALL_DIR}/.venv/bin/weaver-mcp"

# Clone + venv rather than a package launcher, so the server does not depend on
# what happens to be on PATH. Pinned per catalog dependency policy: full commit
# SHA, at least 2 weeks old at pin time. This SHA is "docs: absolute path for
# Claude Desktop; pin work-authorization answers" (2026-08-27). Bumping the pin
# is a PR to this manifest.
#
# Needs Python >= 3.11 (the package's requires-python). `python3` is 3.9 on a
# stock macOS, and there the pip step dies on an unresolvable playwright — so
# the venv step walks newer interpreters first and only then falls back.
install:
  type: git
  url: https://github.com/idea-torx/CareerWeaver.git
  ref: 22d55a574aca3954847d8ec0c1ffc6fb0f1234a2
  bootstrap:
    - "python3.13 -m venv .venv || python3.12 -m venv .venv || python3.11 -m venv .venv || python3 -m venv .venv"
    - ".venv/bin/pip install ."

# No account and no API key — the user's data never leaves their laptop. This
# is `api_key` only because that is the schema's install-time env prompt:
# auth.type `none` prompts for nothing (install_entry), and WEAVER_DATA_DIR
# cannot be defaulted here because it is an absolute per-machine path.
#
# It has to be prompted rather than documented. Hermes spawns this server with
# its own working directory, and the CLI's default (./data) would resolve to a
# fresh empty database with no error at all — the user would get a resume built
# from zero facts instead of a failure. `required: true` fails the install
# loudly instead.
auth:
  type: api_key
  env:
    - name: WEAVER_DATA_DIR
      prompt: "Absolute path to your CareerWeaver data dir (the one holding weaver.db)"
      required: true
      secret: false

suggest:
  keywords: [resume, job application, cover letter, ats, job search, apply]
  hosts:
    - boards.greenhouse.io
    - jobs.lever.co
    - apply.workable.com
    - jobs.ashbyhq.com

post_install: |
  Populate the data directory you just pointed at, if you have not already.
  The install built its own venv, so use the `weaver` CLI inside it:

    <install-dir>/.venv/bin/weaver init
    <install-dir>/.venv/bin/weaver seed-import <your-resume>

  The fact graph is the safety mechanism: tailoring only ever draws on facts
  you imported, so it cannot invent experience you do not have.

  weaver_apply_hold opens a VISIBLE Chrome window, fills the form, and parks at
  audit_pending without submitting. Review the window and press send yourself —
  this server has no submit path at all.

  That fill drives a real browser and can run for minutes. Expect a slow call.

  Start a new Hermes session to load the CareerWeaver tools.
